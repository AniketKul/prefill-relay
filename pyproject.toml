[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prefill-relay"
version = "0.1.0"
description = "Bandwidth-aware prefill scheduling and hybrid KV cache transport"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = ["torch==2.6.0"]

[project.scripts]
prefill-relay = "prefill_relay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
